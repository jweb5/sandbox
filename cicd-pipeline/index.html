<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D CI/CD Pipeline Visualization</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #07090f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    color: #e2e8f0;
  }

  h1 {
    font-size: 1rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #475569;
    margin-bottom: 1.2rem;
    font-weight: 400;
  }

  canvas { display: block; }

  #legend {
    display: flex;
    gap: 1.2rem;
    margin-top: 1.2rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .leg {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #64748b;
  }

  .leg-dot { width: 9px; height: 9px; border-radius: 2px; }
</style>
</head>
<body>
<h1>CI / CD Pipeline</h1>
<canvas id="c"></canvas>
<div id="legend"></div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const W = Math.min(window.innerWidth  - 32, 980);
const H = Math.min(window.innerHeight - 150, 640);
canvas.width  = W;
canvas.height = H;

// ── iso projection ────────────────────────────────────────────────────────────
const cos30 = Math.cos(Math.PI / 6);
const sin30 = Math.sin(Math.PI / 6);

function iso(x, y, z) {
  return { sx: (x - y) * cos30, sy: (x + y) * sin30 - z };
}

// ── colour helpers ────────────────────────────────────────────────────────────
function rgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
function rgba(hex, a) {
  const [r,g,b] = rgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}
function tint(hex, f) {
  const [r,g,b] = rgb(hex);
  return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
}
function lerpColor(c0, c1, t) {
  const [r0,g0,b0] = rgb(c0), [r1,g1,b1] = rgb(c1);
  return `rgb(${Math.round(r0+(r1-r0)*t)},${Math.round(g0+(g1-g0)*t)},${Math.round(b0+(b1-b0)*t)})`;
}

// ── layout ────────────────────────────────────────────────────────────────────
const SCALE = Math.min(W, H) / 7.2;
const CW = 0.52 * SCALE;   // cube half-extent XY
const CD = 0.52 * SCALE;   // cube half-extent Z

const STAGES = [
  { id:'source',   label:'Source',   color:'#38bdf8', gx:0, gy:0  },
  { id:'build',    label:'Build',    color:'#a78bfa', gx:2, gy:0  },
  { id:'test',     label:'Test',     color:'#34d399', gx:4, gy:-1 },
  { id:'security', label:'Security', color:'#fbbf24', gx:4, gy:1  },
  { id:'stage',    label:'Staging',  color:'#fb923c', gx:6, gy:-1 },
  { id:'deploy',   label:'Deploy',   color:'#f472b6', gx:6, gy:1  },
  { id:'monitor',  label:'Monitor',  color:'#60a5fa', gx:8, gy:0  },
];

const EDGES = [
  ['source','build'],
  ['build','test'],
  ['build','security'],
  ['test','stage'],
  ['security','deploy'],
  ['stage','monitor'],
  ['deploy','monitor'],
];

// centre the diagram
const rawPts = STAGES.map(s => iso(s.gx*SCALE, s.gy*SCALE, 0));
const minX = Math.min(...rawPts.map(p=>p.sx));
const maxX = Math.max(...rawPts.map(p=>p.sx));
const minY = Math.min(...rawPts.map(p=>p.sy));
const maxY = Math.max(...rawPts.map(p=>p.sy));
const OX = W/2 - (minX+maxX)/2;
const OY = H/2 - (minY+maxY)/2;

function project(gx, gy, gz = 0) {
  const p = iso(gx*SCALE, gy*SCALE, gz*SCALE);
  return { x: p.sx+OX, y: p.sy+OY };
}

// precompute: pipe connects at vertical centre of cube (gz=0)
// cube occupies gz = -1..+1 (in SCALE units, ±CD)
// top-face label position is at gz = CD/SCALE
STAGES.forEach(s => {
  s.pipe  = project(s.gx, s.gy, 0);          // pipe centre-pierce point
  s.top   = project(s.gx, s.gy, CD/SCALE);   // top face for labels / glow
  s.pulse = Math.random() * Math.PI * 2;
});

// ── cube 8-vertex helper ──────────────────────────────────────────────────────
function cubeVerts(s) {
  const cx = s.gx*SCALE, cy = s.gy*SCALE;
  const w = CW, d = CD;
  const pts = [
    iso(cx-w, cy-w, -d), iso(cx+w, cy-w, -d),
    iso(cx+w, cy+w, -d), iso(cx-w, cy+w, -d),
    iso(cx-w, cy-w,  d), iso(cx+w, cy-w,  d),
    iso(cx+w, cy+w,  d), iso(cx-w, cy+w,  d),
  ];
  return pts.map(p=>({ x:p.sx+OX, y:p.sy+OY }));
}

// ── particles ─────────────────────────────────────────────────────────────────
const particles = [];

function spawnParticles(edge) {
  const src = STAGES.find(s=>s.id===edge[0]);
  const dst = STAGES.find(s=>s.id===edge[1]);
  // more particles, spread evenly
  const count = 7;
  for (let i=0; i<count; i++) {
    particles.push({
      src, dst,
      t:     i / count,
      speed: 0.004 + Math.random() * 0.003,   // ~2-3× faster than before
      size:  3 + Math.random() * 2.5,
      alpha: 0.75 + Math.random() * 0.25,
      trail: [],                               // previous positions for tail
    });
  }
}
EDGES.forEach(spawnParticles);

// ── pipe drawing ──────────────────────────────────────────────────────────────
function edgePts(edge) {
  const src = STAGES.find(s=>s.id===edge[0]);
  const dst = STAGES.find(s=>s.id===edge[1]);
  return { p0: src.pipe, p1: dst.pipe, src, dst };
}

function drawPipe(edge, t) {
  const { p0, p1, src, dst } = edgePts(edge);
  const pulse = 0.6 + 0.4 * Math.sin(t * 3.5 + src.pulse);

  ctx.save();
  const grad = ctx.createLinearGradient(p0.x,p0.y, p1.x,p1.y);
  grad.addColorStop(0, rgba(src.color, 0.9));
  grad.addColorStop(1, rgba(dst.color, 0.9));

  // wide outer glow
  ctx.strokeStyle = grad;
  ctx.lineWidth   = 18;
  ctx.globalAlpha = 0.06 * pulse;
  ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();

  // mid glow
  ctx.lineWidth   = 9;
  ctx.globalAlpha = 0.14 * pulse;
  ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();

  // pipe body
  ctx.lineWidth   = 3.5;
  ctx.globalAlpha = 0.55;
  ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();

  // bright core
  ctx.lineWidth   = 1.4;
  ctx.globalAlpha = 0.9;
  ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();

  // fast travelling dashes
  const dashLen = 14, gapLen = 18;
  ctx.setLineDash([dashLen, gapLen]);
  ctx.lineDashOffset = -((t * 90) % (dashLen + gapLen));
  ctx.lineWidth   = 2;
  ctx.globalAlpha = 0.7 * pulse;
  ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();

  // slow secondary pulse dashes
  ctx.setLineDash([6, 32]);
  ctx.lineDashOffset = -((t * 40) % 38);
  ctx.lineWidth   = 3;
  ctx.globalAlpha = 0.35 * pulse;
  ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();

  ctx.setLineDash([]);
  ctx.restore();
}

// ── particle drawing ──────────────────────────────────────────────────────────
const TRAIL_LEN = 10;

function drawParticle(p) {
  const { p0, p1 } = { p0: p.src.pipe, p1: p.dst.pipe };
  const x = p0.x + (p1.x-p0.x)*p.t;
  const y = p0.y + (p1.y-p0.y)*p.t;
  const col = lerpColor(p.src.color, p.dst.color, p.t);

  // trail
  for (let i=0; i<p.trail.length; i++) {
    const tr = p.trail[i];
    const f  = i / TRAIL_LEN;
    const r  = p.size * f * 0.9;
    if (r < 0.5) continue;
    ctx.globalAlpha = p.alpha * f * 0.5;
    ctx.fillStyle = rgba(col, 1);
    ctx.beginPath();
    ctx.arc(tr.x, tr.y, r, 0, Math.PI*2);
    ctx.fill();
  }

  // glow halo
  const g = ctx.createRadialGradient(x,y,0, x,y, p.size*4);
  g.addColorStop(0,   rgba(col, p.alpha * 0.8));
  g.addColorStop(0.3, rgba(col, p.alpha * 0.3));
  g.addColorStop(1,   rgba(col, 0));
  ctx.globalAlpha = 1;
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, p.size*4, 0, Math.PI*2);
  ctx.fill();

  // bright core
  ctx.fillStyle = '#ffffff';
  ctx.globalAlpha = 0.95;
  ctx.beginPath();
  ctx.arc(x, y, p.size*0.6, 0, Math.PI*2);
  ctx.fill();

  ctx.globalAlpha = 1;
}

// ── cube drawing ──────────────────────────────────────────────────────────────
function drawCube(s, t) {
  const v = cubeVerts(s);
  const pulse = 0.8 + 0.2 * Math.sin(t * 2.1 + s.pulse);
  const glow  = 0.18 + 0.12 * Math.sin(t * 2.6 + s.pulse);

  // ambient glow behind cube
  const g = ctx.createRadialGradient(s.top.x, s.top.y, 0, s.top.x, s.top.y, SCALE*1.05);
  g.addColorStop(0,   rgba(s.color, glow));
  g.addColorStop(1,   rgba(s.color, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s.top.x, s.top.y, SCALE*1.05, 0, Math.PI*2);
  ctx.fill();

  // draw pipe channel line on sides to show pipe going through
  // entry/exit on left face midpoint and right face midpoint
  const lMid = { x:(v[0].x+v[3].x)/2, y:(v[0].y+v[3].y)/2 };
  const rMid = { x:(v[1].x+v[2].x)/2, y:(v[1].y+v[2].y)/2 };

  ctx.save();
  ctx.strokeStyle = rgba(s.color, 0.5*pulse);
  ctx.lineWidth   = 3;
  ctx.beginPath(); ctx.moveTo(lMid.x,lMid.y); ctx.lineTo(v[0].x,v[0].y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rMid.x,rMid.y); ctx.lineTo(v[1].x,v[1].y); ctx.stroke();
  ctx.restore();

  // ── left face (verts 0,4,7,3) — darkest ──
  ctx.beginPath();
  ctx.moveTo(v[0].x,v[0].y); ctx.lineTo(v[4].x,v[4].y);
  ctx.lineTo(v[7].x,v[7].y); ctx.lineTo(v[3].x,v[3].y);
  ctx.closePath();
  ctx.fillStyle   = tint(s.color, 0.22);
  ctx.strokeStyle = rgba(s.color, 0.55);
  ctx.lineWidth   = 1.2;
  ctx.fill(); ctx.stroke();

  // ── right face (verts 1,5,6,2) — mid ──
  ctx.beginPath();
  ctx.moveTo(v[1].x,v[1].y); ctx.lineTo(v[5].x,v[5].y);
  ctx.lineTo(v[6].x,v[6].y); ctx.lineTo(v[2].x,v[2].y);
  ctx.closePath();
  ctx.fillStyle   = tint(s.color, 0.15);
  ctx.strokeStyle = rgba(s.color, 0.55);
  ctx.fill(); ctx.stroke();

  // ── top face (verts 4,5,6,7) — brightest ──
  ctx.beginPath();
  ctx.moveTo(v[4].x,v[4].y); ctx.lineTo(v[5].x,v[5].y);
  ctx.lineTo(v[6].x,v[6].y); ctx.lineTo(v[7].x,v[7].y);
  ctx.closePath();
  const topG = ctx.createLinearGradient(v[4].x,v[4].y, v[6].x,v[6].y);
  topG.addColorStop(0, rgba(s.color, 0.92*pulse));
  topG.addColorStop(1, rgba(s.color, 0.60*pulse));
  ctx.fillStyle   = topG;
  ctx.strokeStyle = rgba(s.color, 0.85);
  ctx.fill(); ctx.stroke();

  // top-edge highlight lines
  ctx.strokeStyle = rgba(s.color, 0.7*pulse);
  ctx.lineWidth   = 1.5;
  [[v[4],v[5]],[v[5],v[6]],[v[6],v[7]],[v[7],v[4]]].forEach(([a,b])=>{
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  });

  // pipe-hole dot on top face centre — shows pipe entry
  ctx.fillStyle   = rgba(s.color, 0.6*pulse);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth   = 0.8;
  ctx.beginPath();
  ctx.arc(s.top.x, s.top.y, SCALE*0.07, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();

  // label on top face
  ctx.fillStyle    = 'rgba(255,255,255,0.93)';
  ctx.font         = `bold ${Math.round(SCALE*0.17)}px 'Segoe UI',sans-serif`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor  = s.color;
  ctx.shadowBlur   = 8;
  ctx.fillText(s.label, s.top.x, s.top.y - SCALE*0.04);
  ctx.shadowBlur = 0;
}

// ── grid floor ────────────────────────────────────────────────────────────────
function drawFloor() {
  ctx.strokeStyle = 'rgba(56,189,248,0.04)';
  ctx.lineWidth = 1;
  for (let i=-1; i<=11; i++) {
    const a = project(i, -3, -CD/SCALE);
    const b = project(i,  4, -CD/SCALE);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  for (let j=-3; j<=4; j++) {
    const a = project(-1, j, -CD/SCALE);
    const b = project(11, j, -CD/SCALE);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
}

// ── render loop ───────────────────────────────────────────────────────────────
let t0 = null;

function frame(ts) {
  if (!t0) t0 = ts;
  const t = (ts - t0) / 1000;

  ctx.clearRect(0,0,W,H);

  // dark vignette glow in centre
  const vg = ctx.createRadialGradient(W/2,H/2,0, W/2,H/2, Math.max(W,H)*0.6);
  vg.addColorStop(0, 'rgba(15,25,60,0.55)');
  vg.addColorStop(1, 'rgba(7,9,15,0)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  drawFloor();

  // pipes (drawn behind cubes so cubes overlap them → pipe appears to pierce through)
  EDGES.forEach(e => drawPipe(e, t));

  // update + draw particles
  particles.forEach(p => {
    const { p0, p1 } = { p0: p.src.pipe, p1: p.dst.pipe };
    const px = p0.x + (p1.x-p0.x)*p.t;
    const py = p0.y + (p1.y-p0.y)*p.t;
    p.trail.unshift({ x:px, y:py });
    if (p.trail.length > TRAIL_LEN) p.trail.pop();
    p.t += p.speed;
    if (p.t > 1) { p.t -= 1; p.trail = []; }
    drawParticle(p);
  });

  // cubes — painter's sort: farthest (highest gx+gy) drawn first
  [...STAGES]
    .sort((a,b) => (b.gx+b.gy) - (a.gx+a.gy))
    .forEach(s => drawCube(s, t));

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

// ── legend ────────────────────────────────────────────────────────────────────
const legend = document.getElementById('legend');
STAGES.forEach(s => {
  const el = document.createElement('div');
  el.className = 'leg';
  el.innerHTML = `<div class="leg-dot" style="background:${s.color}"></div>${s.label}`;
  legend.appendChild(el);
});
</script>
</body>
</html>
