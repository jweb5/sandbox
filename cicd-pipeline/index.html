<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D CI/CD Pipeline Visualization</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e1a;
    --grid: rgba(99,179,237,0.06);
    --col-source:  #38bdf8;
    --col-build:   #a78bfa;
    --col-test:    #34d399;
    --col-stage:   #fbbf24;
    --col-deploy:  #f472b6;
    --col-monitor: #60a5fa;
  }

  body {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    color: #e2e8f0;
  }

  h1 {
    font-size: 1.1rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #94a3b8;
    margin-bottom: 1.5rem;
    font-weight: 400;
  }

  canvas {
    display: block;
    touch-action: none;
  }

  #legend {
    display: flex;
    gap: 1.4rem;
    margin-top: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .leg {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #94a3b8;
  }

  .leg-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
  }
</style>
</head>
<body>
<h1>CI / CD Pipeline</h1>
<canvas id="c"></canvas>
<div id="legend"></div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// ── sizing ────────────────────────────────────────────────────────────────────
const W = Math.min(window.innerWidth - 40, 960);
const H = Math.min(window.innerHeight - 160, 620);
canvas.width  = W;
canvas.height = H;

// ── isometric helpers ─────────────────────────────────────────────────────────
const ISO_ANG = Math.PI / 6;   // 30°
const cos30   = Math.cos(ISO_ANG);
const sin30   = Math.sin(ISO_ANG);

function isoProject(x, y, z) {
  // right-hand iso: x→right, y→depth, z→up
  const sx = (x - y) * cos30;
  const sy = (x + y) * sin30 - z;
  return { sx, sy };
}

// ── colour helpers ────────────────────────────────────────────────────────────
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}
function rgba(hex, a) {
  const {r,g,b} = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}
function darken(hex, f) {
  const {r,g,b} = hexToRgb(hex);
  return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
}

// ── pipeline stages ───────────────────────────────────────────────────────────
// Grid positions in isometric space: (gridX, gridY)
// We lay the pipeline in a branching tree:
//   Source → Build → Test → [Staging, Security] → Deploy → Monitor
const SCALE = Math.min(W, H) / 7.5;

const STAGES = [
  { id:'source',   label:'Source',   color:'#38bdf8', gx:0,   gy:0   },
  { id:'build',    label:'Build',    color:'#a78bfa', gx:2,   gy:0   },
  { id:'test',     label:'Test',     color:'#34d399', gx:4,   gy:-1  },
  { id:'security', label:'Security', color:'#fbbf24', gx:4,   gy:1   },
  { id:'stage',    label:'Staging',  color:'#fb923c', gx:6,   gy:-1  },
  { id:'deploy',   label:'Deploy',   color:'#f472b6', gx:6,   gy:1   },
  { id:'monitor',  label:'Monitor',  color:'#60a5fa', gx:8,   gy:0   },
];

const EDGES = [
  ['source','build'],
  ['build','test'],
  ['build','security'],
  ['test','stage'],
  ['security','deploy'],
  ['stage','monitor'],
  ['deploy','monitor'],
];

// ── cube geometry ─────────────────────────────────────────────────────────────
const CW = 0.55;   // cube half-width in grid units
const CH = 0.55;   // cube half-height
const CD = 0.55;   // cube depth (z) in grid units

function cubeVerts(cx, cy, cz, w, h, d) {
  // 8 corners of a box centred at (cx,cy,cz), dims 2w×2h×2d
  return [
    isoProject(cx-w, cy-h, cz-d),
    isoProject(cx+w, cy-h, cz-d),
    isoProject(cx+w, cy+h, cz-d),
    isoProject(cx-w, cy+h, cz-d),
    isoProject(cx-w, cy-h, cz+d),
    isoProject(cx+w, cy-h, cz+d),
    isoProject(cx+w, cy+h, cz+d),
    isoProject(cx-w, cy+h, cz+d),
  ];
}

// ── offset so whole diagram is centred on canvas ──────────────────────────────
const allIso = STAGES.map(s => isoProject(s.gx * SCALE, s.gy * SCALE, 0));
const minX   = Math.min(...allIso.map(p=>p.sx));
const maxX   = Math.max(...allIso.map(p=>p.sx));
const minY   = Math.min(...allIso.map(p=>p.sy));
const maxY   = Math.max(...allIso.map(p=>p.sy));
const OX = W/2 - (minX + maxX)/2;
const OY = H/2 - (minY + maxY)/2 + SCALE*0.1;

function project(gx, gy, gz=0) {
  const p = isoProject(gx * SCALE, gy * SCALE, gz * SCALE);
  return { x: p.sx + OX, y: p.sy + OY };
}

// pre-compute screen positions for stage centres
STAGES.forEach(s => {
  s.screen = project(s.gx, s.gy, CD);   // top face centre
  s.base   = project(s.gx, s.gy, 0);
});

// ── particles along edges ─────────────────────────────────────────────────────
const particles = [];

function makeParticles(edge) {
  const src = STAGES.find(s=>s.id===edge[0]);
  const dst = STAGES.find(s=>s.id===edge[1]);
  const count = 3 + Math.floor(Math.random()*3);
  for (let i=0; i<count; i++) {
    particles.push({
      src, dst,
      t:    Math.random(),
      speed: 0.0018 + Math.random() * 0.0014,
      size:  2.5 + Math.random() * 2,
      alpha: 0.6 + Math.random() * 0.4,
    });
  }
}
EDGES.forEach(makeParticles);

// ── pulse animation per stage ─────────────────────────────────────────────────
STAGES.forEach((s,i) => { s.pulse = i * 0.4; });

// ── draw cube ─────────────────────────────────────────────────────────────────
function drawCube(s, t) {
  const gx = s.gx, gy = s.gy;
  const verts = cubeVerts(gx*SCALE, gy*SCALE, CD*SCALE, CW*SCALE, CW*SCALE, CD*SCALE);
  const v = verts.map(p => ({ x: p.sx+OX, y: p.sy+OY }));

  const pulse = 0.82 + 0.18 * Math.sin(t * 1.8 + s.pulse);
  const glow  = 0.15 + 0.10 * Math.sin(t * 2.2 + s.pulse);

  // ── glow halo ──
  const g = ctx.createRadialGradient(
    s.screen.x, s.screen.y-4, 0,
    s.screen.x, s.screen.y-4, SCALE*0.95
  );
  g.addColorStop(0,   rgba(s.color, glow));
  g.addColorStop(1,   rgba(s.color, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s.screen.x, s.screen.y-4, SCALE*0.95, 0, Math.PI*2);
  ctx.fill();

  // top face  (verts 4,5,6,7)
  ctx.beginPath();
  ctx.moveTo(v[4].x,v[4].y);
  ctx.lineTo(v[5].x,v[5].y);
  ctx.lineTo(v[6].x,v[6].y);
  ctx.lineTo(v[7].x,v[7].y);
  ctx.closePath();
  const topG = ctx.createLinearGradient(v[4].x,v[4].y,v[6].x,v[6].y);
  topG.addColorStop(0, rgba(s.color, 0.95*pulse));
  topG.addColorStop(1, rgba(s.color, 0.65*pulse));
  ctx.fillStyle   = topG;
  ctx.strokeStyle = rgba(s.color, 0.9);
  ctx.lineWidth   = 1;
  ctx.fill();
  ctx.stroke();

  // left face (verts 0,4,7,3)
  ctx.beginPath();
  ctx.moveTo(v[0].x,v[0].y);
  ctx.lineTo(v[4].x,v[4].y);
  ctx.lineTo(v[7].x,v[7].y);
  ctx.lineTo(v[3].x,v[3].y);
  ctx.closePath();
  ctx.fillStyle   = darken(s.color, 0.28);
  ctx.strokeStyle = rgba(s.color, 0.6);
  ctx.fill();
  ctx.stroke();

  // right face (verts 1,5,6,2)  → slightly brighter than left
  ctx.beginPath();
  ctx.moveTo(v[1].x,v[1].y);
  ctx.lineTo(v[5].x,v[5].y);
  ctx.lineTo(v[6].x,v[6].y);
  ctx.lineTo(v[2].x,v[2].y);
  ctx.closePath();
  ctx.fillStyle   = darken(s.color, 0.18);
  ctx.strokeStyle = rgba(s.color, 0.6);
  ctx.fill();
  ctx.stroke();

  // edge highlights
  ctx.strokeStyle = rgba(s.color, 0.55*pulse);
  ctx.lineWidth   = 1.2;
  [[v[4],v[5]],[v[5],v[6]],[v[6],v[7]],[v[7],v[4]]].forEach(([a,b])=>{
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  });

  // label
  ctx.fillStyle   = 'rgba(255,255,255,0.88)';
  ctx.font        = `bold ${Math.round(SCALE*0.18)}px 'Segoe UI',sans-serif`;
  ctx.textAlign   = 'center';
  ctx.textBaseline= 'middle';
  ctx.fillText(s.label, s.screen.x, s.screen.y - SCALE*0.05);
}

// ── draw edge line ─────────────────────────────────────────────────────────────
function edgeMidPoints(src, dst) {
  // Lines travel along top-face of cubes (z = CD)
  const p0 = src.screen;
  const p1 = dst.screen;
  return { p0, p1 };
}

function drawEdge(edge, t) {
  const src = STAGES.find(s=>s.id===edge[0]);
  const dst = STAGES.find(s=>s.id===edge[1]);
  const {p0, p1} = edgeMidPoints(src, dst);

  // neon tube
  ctx.save();
  const grad = ctx.createLinearGradient(p0.x, p0.y, p1.x, p1.y);
  grad.addColorStop(0,   rgba(src.color, 0.85));
  grad.addColorStop(1,   rgba(dst.color, 0.85));

  // glow layer
  ctx.strokeStyle = grad;
  ctx.lineWidth   = 6;
  ctx.globalAlpha = 0.18;
  ctx.beginPath();
  ctx.moveTo(p0.x, p0.y);
  ctx.lineTo(p1.x, p1.y);
  ctx.stroke();

  // core line
  ctx.globalAlpha = 1;
  ctx.lineWidth   = 1.8;
  ctx.beginPath();
  ctx.moveTo(p0.x, p0.y);
  ctx.lineTo(p1.x, p1.y);
  ctx.stroke();

  // travelling dash
  const len   = Math.hypot(p1.x-p0.x, p1.y-p0.y);
  const dash  = 18;
  const gap   = 22;
  const offset = (t * 55) % (dash+gap);
  ctx.setLineDash([dash, gap]);
  ctx.lineDashOffset = -offset;
  ctx.globalAlpha    = 0.55;
  ctx.lineWidth      = 1.5;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

// ── draw particle ─────────────────────────────────────────────────────────────
function drawParticle(p) {
  const {p0, p1} = edgeMidPoints(p.src, p.dst);
  const x = p0.x + (p1.x - p0.x) * p.t;
  const y = p0.y + (p1.y - p0.y) * p.t;
  const col = p.t < 0.5 ? p.src.color : p.dst.color;

  const g = ctx.createRadialGradient(x,y,0, x,y, p.size*2.5);
  g.addColorStop(0,   rgba(col, p.alpha));
  g.addColorStop(0.4, rgba(col, p.alpha*0.5));
  g.addColorStop(1,   rgba(col, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, p.size*2.5, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x, y, p.size*0.55, 0, Math.PI*2);
  ctx.fill();
}

// ── grid floor ────────────────────────────────────────────────────────────────
function drawFloor() {
  const cols = 10, rows = 5;
  const ox = -1, oy = -2.5;
  ctx.strokeStyle = 'rgba(99,179,237,0.055)';
  ctx.lineWidth = 1;
  for (let i=0; i<=cols; i++) {
    const a = project(ox + i*SCALE/SCALE, oy, -CD);
    const b = project(ox + i*SCALE/SCALE, oy+rows, -CD);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  for (let j=0; j<=rows; j++) {
    const a = project(ox,         oy + j*SCALE/SCALE, -CD);
    const b = project(ox+cols,    oy + j*SCALE/SCALE, -CD);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
}

// ── main loop ─────────────────────────────────────────────────────────────────
let t0 = null;

function frame(ts) {
  if (!t0) t0 = ts;
  const t = (ts - t0) / 1000;

  ctx.clearRect(0,0,W,H);

  // background glow
  const bg = ctx.createRadialGradient(W/2,H/2,0, W/2,H/2, Math.max(W,H)*0.65);
  bg.addColorStop(0, 'rgba(30,41,80,0.6)');
  bg.addColorStop(1, 'rgba(10,14,26,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  drawFloor();

  // edges first (behind cubes)
  EDGES.forEach(e => drawEdge(e, t));

  // particles
  particles.forEach(p => {
    p.t += p.speed;
    if (p.t > 1) p.t -= 1;
    drawParticle(p);
  });

  // cubes (painter's-algo: sort by depth = gx+gy desc)
  [...STAGES]
    .sort((a,b) => (b.gx + b.gy) - (a.gx + a.gy))
    .forEach(s => drawCube(s, t));

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

// ── legend ────────────────────────────────────────────────────────────────────
const legend = document.getElementById('legend');
STAGES.forEach(s => {
  const el = document.createElement('div');
  el.className = 'leg';
  el.innerHTML = `<div class="leg-dot" style="background:${s.color}"></div>${s.label}`;
  legend.appendChild(el);
});
</script>
</body>
</html>
